name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: chatapp_test

    strategy:
      matrix:
        node-version: ['lts/*']

    env:
      CI: true
      NODE_ENV: test
      PROTOCOL: HTTP
      SESSION_SECRET: test_session_secret
      CRYPTO_SECRET: test_crypto_secret
      MONGODB_USERS_URI: mongodb://localhost:27017/chatapp_users_test
      MONGODB_USERS_CONVERSATIONS: mongodb://localhost:27017/chatapp_conversations_test
      MONGO_SESSIONS_URI: mongodb://localhost:27017/chatapp_sessions_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build --if-present

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB (localhost:27017) to accept connections..."
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; do sleep 1; done'
          echo "MongoDB port is open."

      - name: Run tests
        run: npm test --if-present
